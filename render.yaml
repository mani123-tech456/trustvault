services:
  - type: web
    name: trustvault
    runtime: docker
    # Free tier is for disposable judging/demo data only: local files are ephemeral.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TRUSTVAULT_HOST
        value: 0.0.0.0
      - key: TRUSTVAULT_DATA
        value: /var/lib/trustvault
      - key: PORT
        value: 10000
      - key: TRUSTVAULT_ENCRYPTION_KEY
        generateValue: true
      - key: TRUSTVAULT_AUDIT_KEY
        generateValue: true
